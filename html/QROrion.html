<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://s.brightspace.com/lib/fonts/0.6.1/fonts.css">
    <link rel="stylesheet" href="https://templates.lcs.brightspace.com/lib/assets/css/styles.min.css">
</head>
<body style="color: rgb(32, 33, 34); font-family: Lato, sans-serif; font-size: 12px; padding: 20px;">
<p id="status">Loading QR code...</p>
<div id="container" style="text-align: center; margin-top: 20px;">
    <div id="qrcode"></div>
    <div id="info" style="margin-top: 20px; padding: 15px; background-color: #f5f5f5; border-radius: 4px; display: none;">
        <p style="margin: 5px 0;" id="assignmentInfo"></p>
        <p style="margin: 5px 0;" id="emailInfo"></p>
    </div>
</div>
<script>
    /// Do not change above this line ///
    const assignmentShortname = 'BZL Differentiatie (!)'; // Assignment ShortName as in D2L
    const qrSize = 300; // QR code size in pixels

    /// Do not change below this line ///

    // Brightspace API whoami call
    fetch('https://orion.hogent.be/d2l/api/lp/1.28/users/whoami')
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text().then(text => {
                console.log('Raw response:', text);
                try {
                    return JSON.parse(text);
                } catch (e) {
                    console.error('Failed to parse JSON:', e);
                    throw new Error('Response was not valid JSON');
                }
            });
        })
        .then(whoami => {
            const studentId = whoami.Identifier;
            const studentEmail = whoami.UniqueName; // E-mail
            
            // Get OrgUnitID from URL parameters or D2L JavaScript API
            const orgUnitId = new URLSearchParams(window.location.search).get('ou') || 
                             (typeof D2L !== 'undefined' && D2L.LP && D2L.LP.Web ? D2L.LP.Web.OrgUnitId : null);
            
            if (!orgUnitId) {
                document.getElementById('status').textContent = 'Error: Cannot find orgunit ID';
                return;
            }
            
            const data = JSON.stringify({
                studentEmail: studentEmail,
                orion: {
                    orgUnitId: parseInt(orgUnitId),
                    studentId: studentId,
                    assignmentShortname: assignmentShortname
                }
            });
            
            const encoded = encodeURIComponent(data);
            const url = `https://api.qrserver.com/v1/create-qr-code/?size=${qrSize}x${qrSize}&data=${encoded}`;
            
            const qrcodeDiv = document.getElementById('qrcode');
            const img = document.createElement('img');
            img.src = url;
            img.alt = "QR Code";
            img.style.maxWidth = '100%';
            img.style.borderRadius = '4px';
            qrcodeDiv.innerHTML = '';
            qrcodeDiv.appendChild(img);
            
            // Display student email and assignment name
            document.getElementById('assignmentInfo').textContent = `${assignmentShortname}`;
            document.getElementById('emailInfo').textContent = `${studentEmail}`;
            document.getElementById('info').style.display = 'block';
            document.getElementById('status').textContent = '';
        })
        .catch(error => {
            console.error('Error with whoami call:', error);
            document.getElementById('status').textContent = 'Error loading user data';
        });
</script>
</body></html>
