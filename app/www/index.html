<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Orion Scanner</title>
    <script src="lib/html5-qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 0 auto; padding: 15px; padding-top: max(15px, env(safe-area-inset-top)); padding-bottom: 80px; }
        #reader { width: 100%; max-width: 350px; margin: 0 auto 20px auto; border-radius: 8px; overflow: hidden; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; }
        input { width: 100%; padding: 8px; margin-top: 3px; box-sizing: border-box; font-size: 14px; }
        button { margin: 15px 0; padding: 10px 15px; background: #0078d4; color: white; border: none; width: 100%; font-size: 14px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .form-row label { margin-top: 0; }
        details { border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; }
        summary { background: #f8f9fa; padding: 8px 12px; font-weight: bold; font-size: 13px; border-radius: 6px; }
        .content { padding: 10px; }
        .result { display: none; padding: 15px; border-radius: 4px; border: 1px solid; margin-bottom: 20px; }
        .result.show { display: block; }
        .result.success { background: #d1edcc; color: #155724; border-color: #c3e6cb; }
        .result.error { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        #debugLog { margin-top: 10px; padding: 10px; background: #eee; border: 1px solid #999; font-family: monospace; font-size: 11px; max-height: 300px; overflow-y: auto; word-break: break-all; }
        #version { margin-top: 20px; font-size: 11px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <b>Orion Scanner</b>

    <details id="settings">
        <summary>⚙️ Settings</summary>
        <div class="content">
            <label for="settings_ansBearer">ANS Bearer Token</label>
            <input type="password" id="settings_ansBearer" placeholder="ANS bearer token">
            <button id="saveSettings">Save Settings</button>
        </div>
    </details>

    <div id="reader"></div>
    <button id="startScan">Start Scanning</button>

    <div id="ansForm" style="display: none;">
        <details open>
            <summary>📧 Basic Info</summary>
            <div class="content">
                <label>Student e-mail</label>
                <input type="email" id="ans_studentEmail" readonly>
            </div>
        </details>
        <details open>
            <summary>🎯 Assignment Info</summary>
            <div class="content">
                <label>Assignment ID</label>
                <input type="number" id="ans_assignmentId" readonly>
                <div class="form-row">
                    <div><label>Deadline</label><input type="number" id="ans_deadline" readonly></div>
                    <div><label>Duration</label><input type="number" id="ans_duration" readonly></div>
                    <div><label>IOEM</label><input type="number" id="ans_ioem" readonly></div>
                </div>
                <label for="ans_openDatetime">ANS Open DateTime</label>
                <input type="datetime-local" id="ans_openDatetime">
                <label for="ans_deadlineDatetime">ANS Deadline DateTime</label>
                <input type="datetime-local" id="ans_deadlineDatetime">
            </div>
        </details>
        <button id="submitAns">Submit</button>
    </div>

    <div id="result" class="result"></div>

    <details style="margin-top: 30px;">
        <summary>🐞 Debug Log</summary>
        <button id="clearLog" style="width: auto; padding: 5px;">Clear Log</button>
        <div id="debugLog">Ready...</div>
    </details>

    <div id="version"></div>

    <script src="ans.js"></script>
    <script src="app.js"></script>
</body>
</html>
